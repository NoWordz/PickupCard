name: 同步商店文案

# 只手动触发：商店正文是"发布动作"，不该在推代码时被动发生。
#
# 【默认演练】不勾 apply 时只拉远端正文比差异、什么都不改；勾了才真的 PATCH。
#
# 【为什么只有 Modrinth】CurseForge 的官方 Upload API **没有改项目描述的端点**（只有上传
# 文件的），所以那边只能人工贴 —— 见 tools/store_sync.py 的说明。别为它写自动化。
#
# 【正文规范见 skill `store-description`】三份正文内容必须相同、只有标记与语言不同。
# 所以推送前先过一遍结构闸（下面那一步）：走这条路的人就会撞上 `check_store_copy` /
# `check_store_parity` —— 规范写在 skill 里，但拦住你的是这道闸（2026-09-21 立）。
#
# 【token 没配会怎样】脚本会在 project_id 还是 UNSET 时直接报错退出（不是静默跳过）：
# 这个工作流是手动触发的，报错比"跑了但什么都没做"更有用。

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "真的推上去（不勾 = 只演练、看差异）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  modrinth:
    name: Modrinth 正文
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 正文推上去就改不回来了（Modrinth 侧只留最后一次）。所以先把闸跑在推送之前：
      # 骨架、两份一致、节表、条目数、事实 token —— 任何一条不过就别推。
      - name: 结构闸（正文不合规就别推）
        run: python3 tools/verify_targets.py

      - name: 演练（只看差异）
        if: ${{ !inputs.apply }}
        run: python3 tools/store_sync.py

      - name: 同步
        if: ${{ inputs.apply }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 tools/store_sync.py --apply
