name: 同步商店文案

# 只手动触发：商店正文是"发布动作"，不该在推代码时被动发生。
#
# 【默认演练】不勾 apply 时只拉远端正文比差异、什么都不改；勾了才真的 PATCH。
#
# 【为什么只有 Modrinth】CurseForge 的官方 Upload API **没有改项目描述的端点**（只有上传
# 文件的），所以那边只能人工贴 —— 见 tools/store_sync.py 的说明。别为它写自动化。
#
# 【正本是 README】描述只在 `README.md` / `README_EN.md` 里改；这个工作流现出 Modrinth 那一份
# 再推上去，**仓库里不留描述文档**（用户 2026-09-21：「别在仓库 docs 里放描述文档了，我上传商店
# 是一定会微调的，到时候又不统一」）。规范见 skill `store-description`。
#
# 【页面上的手工微调是允许的】线上那份就是权威。演练（不勾 apply）会把差异打出来 ——
# 差异里有你手改的内容时，自己决定是改 README 还是保留页面版本。**勾了 apply 会覆盖。**
# 所以推送前先过一遍结构闸（下面那一步）：`check_description_pipeline`。
#
# 【token 没配会怎样】脚本会在 project_id 还是 UNSET 时直接报错退出（不是静默跳过）：
# 这个工作流是手动触发的，报错比"跑了但什么都没做"更有用。

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "真的推上去（不勾 = 只演练、看差异）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  modrinth:
    name: Modrinth 正文
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 正文推上去就改不回来了（Modrinth 侧只留最后一次）。所以先把闸跑在推送之前：
      # 骨架、两份一致、节表、条目数、事实 token —— 任何一条不过就别推。
      - name: 结构闸（正文不合规就别推）
        run: python3 tools/verify_targets.py

      - name: 演练（只看差异）
        if: ${{ !inputs.apply }}
        run: python3 tools/store_sync.py

      - name: 同步
        if: ${{ inputs.apply }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 tools/store_sync.py --apply
