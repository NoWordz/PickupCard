# 仓库级身份：所有目标共用一份，各平台不许自己定义。
#
# 【为什么只有一处】一次发版所有目标出的是同一个版本号的 jar —— 玩家在不同加载器上
# 装到的 vX.Y.Z 必须是同一次改动。留在各平台里，它们就能各自漂移，而"某个目标悄悄
# 落后"正是这套结构要治的病。
#
# 【读不到就失败，不给默认值】各平台由 gradle/pickupcard-layers.gradle 读本文件，
# 缺键直接抛 GradleException。悄悄退回一个默认值等于把那个病放回来，而且是静默的：
# jar 照样出得来，只是版本号对不上。

mod_id=pickupcard
mod_name=Pickup Card
mod_license=MIT
mod_group_id=com.niuqu.pickupcard
mod_authors=扭曲 (E33EPUS)
mod_description=Every item you pick up becomes a card on your HUD
# 【仓库地址也只有一处】mods.toml 的 issueTrackerURL / displayURL 都从它拼出来，
# 资源文件里不许再出现 github.com 字面量 —— 仓库改名或换账号时漏改一处，就是游戏里一个
# 点不开的链接，而构建照样是绿的。tools/verify_targets.py 盯着这条。
mod_repo_url=https://github.com/NoWordz/PickupCard
mod_credits=NanoVG and NanoSVG by Mikko Mononen (zlib), LWJGL 3.3.1 (BSD-3-Clause) - see THIRD_PARTY_NOTICES.md
mod_version=0.2.5

# 发布目标（同样的值对所有目标成立）
curseforge_project_id=UNSET
modrinth_project_id=UNSET
