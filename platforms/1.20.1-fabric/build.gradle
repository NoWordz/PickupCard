import groovy.json.JsonOutput

plugins {
    id 'fabric-loom' version '1.7.4'
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

apply from: '../../gradle/pickupcard-layers.gradle'

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-Fabric-${pickupcardTarget.minecraft}"
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.terraformersmc.com/releases/' }
        }
        filter { includeGroup 'com.terraformersmc' }
    }
    flatDir { dirs '../../third_party/trellis' }
}

loom {
    accessWidenerPath = file('src/main/resources/pickupcard.accesswidener')
    mixin {
        defaultRefmapName = 'mixins.pickupcard.refmap.json'
    }
    runs {
        client {
            vmArg "-Dpickupcard.harness.auto=${providers.gradleProperty('harnessAuto').getOrElse('off')}"
            if (providers.gradleProperty('quickPlayWorld').isPresent()) {
                programArgs '--quickPlaySingleplayer', providers.gradleProperty('quickPlayWorld').get()
            }
        }
    }
}

def nvgVersion = '3.3.1'
def trellisVersion = '0.1.0-SNAPSHOT'
def nvgNatives = configurations.create('nvgNatives') {
    canBeConsumed = false
    transitive = false
}
def unpackNvgNatives = tasks.register('unpackNvgNatives', Sync) {
    from({ nvgNatives.files.collect { zipTree(it) } }) {
        include 'windows/**', 'linux/**', 'macos/**'
    }
    into layout.buildDirectory.dir('generated/nvgNatives')
}
sourceSets.main.resources.srcDir(unpackNvgNatives)

dependencies {
    minecraft "com.mojang:minecraft:${pickupcardTarget.minecraft}"
    mappings loom.officialMojangMappings()
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    modImplementation "net.fabricmc:fabric-loader:${pickupcardTarget.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "maven.modrinth:ohNO6lps:${forge_config_api_port_version}"
    modCompileOnly "com.terraformersmc:modmenu:${mod_menu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${mod_menu_version}"

    // Minecraft supplies LWJGL core. Only the matching NanoVG binding is nested.
    implementation("org.lwjgl:lwjgl-nanovg:${nvgVersion}") { transitive = false }
    include("org.lwjgl:lwjgl-nanovg:${nvgVersion}") { transitive = false }
    ['windows', 'linux', 'macos', 'macos-arm64'].each { platform ->
        add('nvgNatives', "org.lwjgl:lwjgl-nanovg:${nvgVersion}:natives-${platform}")
    }
    ['core', 'nvg'].each { module ->
        def coordinates = "dev.e33.trellis:${module}:${trellisVersion}"
        implementation coordinates
        include coordinates
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    from(new File(pickupcardRepoRoot, 'LICENSE'))
    from(new File(pickupcardRepoRoot, 'THIRD_PARTY_NOTICES.md'))
    from(new File(pickupcardRepoRoot, 'design/icon.png')) { rename 'icon.png', 'logo.png' }
    def metadata = ['mod_id', 'mod_name', 'mod_version', 'mod_license', 'mod_authors',
                    'mod_description', 'mod_repo_url', 'mod_credits']
            .collectEntries { [(it): project.property(it)] }
    metadata.minecraft_version = pickupcardTarget.minecraft
    metadata.issue_tracker_url = "${mod_repo_url}/issues"
    metadata.fabric_api_requirement = ">=${fabric_api_version}"
    // Loom 1.7 rewrites nested-JAR metadata. ASCII JSON escapes preserve text on Windows code pages.
    def jsonMetadata = metadata.collectEntries { key, value ->
        String encoded = JsonOutput.toJson(value.toString())
        [(key): encoded.substring(1, encoded.length() - 1)]
    }
    inputs.properties jsonMetadata
    filesMatching('fabric.mod.json') { expand jsonMetadata }
}

tasks.named('jar', Jar) {
    manifest.attributes(
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors
    )
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge)
apply from: '../../gradle/publish-mods.gradle'
