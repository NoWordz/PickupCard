plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

// 共享层装配：读仓库级身份 + 把 shared/ 与本目标挂载的层接进源集。
// 判定依据在 versions/*.json，本平台不做任何目标名硬编码。
apply from: '../../gradle/pickupcard-layers.gradle'

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-Forge-${project.minecraft_version}"
}

// Forge 1.20.1 runs on Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Forge's production runtime names are SRG, so the refmap has to be
            // remapped against the SRG file ForgeGradle generates.
            jvmArg '-Dmixin.env.remapRefMap=true'
            jvmArg "-Dmixin.env.refMapRemappingFile=${projectDir}/build/createSrgToMcp/output.srg"

            // harness 自动驱动：./gradlew runClient -PharnessAuto=shot
            // 让"开屏 → 注入样例 → 截图 → 退出"跑成一条无人值守的命令，
            // 验证因此不再依赖有人在机器前按键。
            jvmArg "-Dpickupcard.harness.auto=${project.findProperty('harnessAuto') ?: 'off'}"
            // 运行时把 GUI 缩放定死（1..5）："dev 跑不出小画布"靠它解决
            jvmArg "-Dpickupcard.harness.guiScale=${project.findProperty('harnessGuiScale') ?: 'off'}"
            // 把"救回"推到第几 tick —— 退场连拍要占掉 80 tick，默认的 15 会中途掐断它
            jvmArg "-Dpickupcard.harness.reviveAfter=${project.findProperty('harnessReviveAfter') ?: '15'}"
            // 拍完稳态那张之后还活多久 —— 同上，默认的 70 会把退场连拍从中途掐断
            jvmArg "-Dpickupcard.harness.quitAfter=${project.findProperty('harnessQuitAfter') ?: '70'}"
            // 首几帧的分段计时（外壳/图标/文字各花多久）：./gradlew runClient -PpcProfile=1
            jvmArg "-Dpickupcard.profile=${project.findProperty('pcProfile') ?: 'off'}"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.configs', 'pickupcard.mixins.json'

            // 固定窗口大小。窗口大小决定 GUI 缩放，GUI 缩放决定截图里卡片的像素尺寸 ——
            // 不固定的话，"这次量出来怎么和上次不一样"有一半的可能是窗口变了。
            // 1280x720 下自动 GUI 缩放是 3：一张卡 32 逻辑 px -> 96 设备 px，量得比 2 倍时准。
            // 窗口尺寸可从命令行覆盖：-Pwidth=854 -Pheight=480
            // （dev 默认 1280x720 在 guiScale 3 下是 427x240 —— 那档下很多"画布太小"的分支
            //  根本走不到：自动缩放、三列退让、列表滚动都卡在这儿）
            args '--width', (project.findProperty('width') ?: '1280'),
                    '--height', (project.findProperty('height') ?: '720')

            // 【harness 必须自己进世界】harness 的注入条件是 mc.level != null，它不会替玩家点开
            // 单人存档 —— 从前每次跑都得有人手动进世界，没人进它就一路干等、什么都不会发生。
            // 1.20 起有 --quickPlaySingleplayer：启动直接进存档。只在本轮带 harnessAuto 时加，
            // 免得平时开 dev 客户端被强行拽进世界。
            //
            // 【为什么必须写在这个块里】它一度被写在下面的 `server` 块里 —— 而 runClient 用的是
            // `client` 块，于是这个参数压根没进命令行，客户端照旧停在主菜单干等（2026-09-17 实测：
            // 日志停在 "Sound engine started" 两分钟没声，`Get-CimInstance` 打出来的命令行结尾
            // 是 `--width 1280 --height 720 --mixin.config …`，没有 --quickPlaySingleplayer）。
            // 也别挪进上面的 `configureEach`：那个块 server 也会继承，而 quickPlay 是客户端参数。
            if ((project.findProperty('harnessAuto') ?: 'off') != 'off') {
                args '--quickPlaySingleplayer', (project.findProperty('world') ?: 'New World')
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.configs', 'pickupcard.mixins.json'
            args '--nogui'
            // 注意：--quickPlaySingleplayer 是客户端参数，只能待在 `client` 块里（见那里的注释）。
        }
    }
}

mixin {
    add sourceSets.main, 'mixins.pickupcard.refmap.json'
    config 'pickupcard.mixins.json'
}

repositories {
    mavenCentral()

    // RarityCore（稀有度联动，可选软依赖）。2026-09-20 定案走反射桥（compat/RarityCoreBridge，
    // MethodHandle 懒解析），不引编译期依赖——CI 与开发机都没有它的 jar，编译期引用会断构建。
    // 这个 maven 仓库是当年为 compileOnly 方案预埋的，留给将来若要做编译期 API 校验时用；
    // 运行期由 ModList 探测，玩家装没装都不影响本 mod 的其他功能。
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // China mirrors last: fallback for local builds; overseas CI resolves from the canonical repos above
    maven {
        url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
        allowInsecureProtocol = true
    }
}

// 【打包方式：dev 摊平 + prod 以 JarJar 嵌套】
// v0.2.2（含）以前是"自包含"：绑定与 native 直接摊进本 jar。2026-09-19 实测它与 UI Deck
// 同装时 JPMS 直接炸（两个 mod 都导出 org.lwjgl.nanovg 包 —— 摊平副本各自成包导出，
// 模块系统不允许），见仓库根/docs 的 nanovg-jarjar-hotfix 交接。
// 现在的分工：开发期照旧摊进 classes 目录（dev 类加载器只认自己的 classes 根，见下）；
// 发布产物里**类**由 JarJar 嵌套的 lwjgl-nanovg 供应（嵌套 jar 自成模块，多 mod 同库
// 按版本去重，不再导出同名包）；**native 资源目录仍摊进主 jar**（windows/x64/... 是
// 资源不是类，不产生 JPMS 包导出，LWJGL 的 SharedLibraryLoader 按资源路径自取 ——
// 实例里 UI Deck 的 dll 就是这么从本 mod 的资源里拿的，两边都必须有人带 native）。
// 【为什么当年放弃 JarJar】注释里记的是"直接写 3.3.1 会让 :jarJar 配置期失败" ——
// 正确写法是单元素区间 [3.3.1]（钉死单一版本），写裸 3.3.1 才失败；UI Deck 0.1.1
// 已在真实 148-mod 实例验证整条链，本文件照抄那套配方。

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'org.spongepowered:mixin:0.8.5'

    // ---- 矢量渲染引擎：NanoVG ----
    // 【版本钉死在 3.3.1】启动日志里 MC 1.20.1 加载的是 "LWJGL version 3.3.1 build 7"。
    // 绑定（Java 侧）和 native（C 侧）成对发布，混版本会在第一次调用时 UnsatisfiedLinkError。
    // 【为什么是它】绑定 122 KB + 四平台 native 合计约 835 KB（win 265/linux 202/mac 197/mac-arm64 170），
    // 是唯一同时算得上"高级"和"轻量"的矢量画布：Skija 体积大二十倍且本机有崩溃前科，
    // ModernUI 25 MB + LGPL，而且它的圆角也是同一套 IQ SDF。
    // 【SVG 是白送的】绑定自带 NanoSVG（nnsvgParse / NSVGImage / NSVGShape / NSVGPath），
    // 所以"用 SVG 纯矢量绘制"既不用再加依赖，也不用自己写路径解析器。
    implementation 'org.lwjgl:lwjgl-nanovg:3.3.1'
    // 开发与测试期：native 直接进 classpath，LWJGL 的 SharedLibraryLoader 自己解压到临时目录。
    // 【发布前必做】四平台 native 必须 JiJ 进 jar，否则玩家侧第一次画卡就是 UnsatisfiedLinkError。
    runtimeOnly 'org.lwjgl:lwjgl-nanovg:3.3.1:natives-windows'
    // 进开发环境 + 打进 jar（四个平台都要，缺平台的症状是玩家侧 UnsatisfiedLinkError）

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------
// 开发期把 NanoVG 塞进 runClient 的 legacy classpath
// ---------------------------------------------------------------------------
// 【为什么需要这一段】Forge 1.20.1 的 dev 启动不走 JVM 的 -cp：引导类
// BootstrapLauncher 用 -DlegacyClassPath.file 指向 FG 生成的
// build/classpath/runClient_minecraftClasspath.txt，而那个文件只列 MC 与 Forge 的库。
// 所以第三方库只写 implementation 的话：编译过、单元测试过（测试走 testRuntimeClasspath）、
// 但 runClient 里 mod 的类加载器看不见它 —— 报错是 NoClassDefFoundError，
// 而且只在真的去画的那一刻才炸。
// 【为什么不用别的办法】FG6 的 minecraft 配置不接受额外 artifact，也没有
// minecraftImplementation 之类的东西；jarJar 只管往 jar 里打（发布用），不影响 dev 启动。
// 所以这里做最直白的一件事：FG 写完那个文件之后，我们把该进去的 jar 追加上去。
// 【失败要响】追加前先确认文件存在，缺文件直接抛，不然会退化成一个"跑起来但没引擎"的
// 静默失败 —— 那正是这个项目一直在治的病。
configurations {
    nvgDev
}

dependencies {
    nvgDev 'org.lwjgl:lwjgl-nanovg:3.3.1'
    ['natives-windows', 'natives-linux', 'natives-macos', 'natives-macos-arm64'].each { classifier ->
        nvgDev "org.lwjgl:lwjgl-nanovg:3.3.1:${classifier}"
    }
}

// ---------------------------------------------------------------------------
// 开发期：把 NanoVG 摊进我们自己的 classes 目录
// ---------------------------------------------------------------------------
// 【为什么不能靠 classpath】Forge 的 dev 启动器把游戏类加载器建在一个"层"上，
// 而那个层只吃 legacyClassPath 文件里的条目。实测证明过三件事：
//   1) implementation / runtimeOnly 只让编译和单元测试通过，runClient 里看不见
//      （报 NoClassDefFoundError）；
//   2) 往 FG 生成的 legacy classpath 文件追加会被 runClient 自己的 action 覆盖；
//   3) 用 jvmArg 覆盖 -DlegacyClassPath.file 会让 BootstrapLauncher 直接崩
//      （它拿那个值去 Paths.get，不接受我们换文件）。
// 【所以走这条】我们的 classes 目录本身就是类加载器的一个根，摊进去就一定能看见 ——
// 效果等同于 shade，但只在开发期做（发布走 jarJar，不污染 jar）。
// 【失败要响】找不到 jar 直接抛，不留下一个"能跑但没引擎"的静默状态。
// 摊平：开发期要它（类加载器只认自己的 classes 根）。
// 发布产物里**类不再要**（JarJar 嵌套供应，见下面的 jarJar 段），但 **native 资源仍要**
// —— 所以 jar/jarJar 还得消费这个写进 classes 目录的动作（Gradle 校验要求显式声明）。
tasks.register('unpackNvg', Copy) {
    dependsOn 'compileJava'
    def jars = configurations.nvgDev
    def binding = jars.files.find { it.name == 'lwjgl-nanovg-3.3.1.jar' }
    def natives = jars.files.findAll { it.name.contains('natives') }
    if (binding == null || natives.size() != 4) {
        throw new GradleException("NanoVG 摊平失败：需要 1 个绑定 + 4 个平台 native，实际 ${jars.files*.name}")
    }
    // 绑定：Java 类；native：各平台目录下的 dll/so/dylib（LWJGL 按 <os>/<arch>/... 的资源路径找）
    from(zipTree(binding)) { include 'org/lwjgl/nanovg/**' }
    natives.each { jar ->
        from(zipTree(jar)) { include 'windows/**', 'linux/**', 'macos/**' }
    }
    into layout.buildDirectory.dir('classes/java/main')
    outputs.upToDateWhen { false }
    doLast { logger.lifecycle("NanoVG 摊平完成（绑定 + ${natives.size()} 个平台 native）-> build/classes/java/main") }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'unpackNvg'
}

// ---------------------------------------------------------------------------
// prod：nanovg 以 JarJar 嵌套（嵌套 jar 自成模块，多 mod 同库按版本去重）。
// 摊平副本进 jar 与 UI Deck 同装 = JPMS ResolutionException 启动即炸（2026-09-19 实测）。
// ---------------------------------------------------------------------------
jarJar.enable()
dependencies {
    // 钉死 3.3.1：与 MC 运行时 LWJGL 同版（绑定/native/核心三者错版本 = UnsatisfiedLinkError）。
    // 区间开放 [3.3.1,3.4) 会解析到 3.3.6 且连带嵌套第二份 LWJGL 核心（实测）。
    jarJar(implementation("org.lwjgl:lwjgl-nanovg:[3.3.1]"))
}
tasks.named('jarJar', Jar).configure {
    // 主产物名归它（jar 让位成 -slim，见下）—— 部署与 CI 认的还是 pickupcard-Forge-1.20.1-<ver>.jar
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // 摊平副本的类文件不进嵌套产物（prod 的类由嵌套 jar 供应）；
    // native 资源目录（windows/x64/...）无类文件、无 JPMS 包导出，保留在主 jar
    exclude 'org/lwjgl/nanovg/**'
    // unpackNvg 写 classes 目录，Gradle 校验要求显式声明消费关系
    dependsOn 'unpackNvg'
    dependsOn 'verifyRefmap'
    // 最终产物是它：manifest 必须整份搬过来 —— 尤其是 MixinConfigs，缺了 mixin 不加载、
    // 拾取事件整个哑掉（UI Deck 没有 mixin，它的参考实现只有 4 个属性，别照抄这点）
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'pickupcard.mixins.json'
        ])
    }

    // 1.20.1 生产环境跑 SRG 名：jarJar 产物也必须过 reobf（FG6 造了 reobfJarJar 任务但
    // 不自动挂链 —— 漏了它的 jar 编译照过、测试照绿，上线第一次渲染前全是 NoSuchMethodError）。
    // 实证：漏挂时主产物 SRG 引用=0，挂上后与 reobfJar 处理过的产物一致。
    finalizedBy 'reobfJarJar'
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'      // 主产物名让位给 jarJar
    // refmap 会同时出现在 build/resources/main（copyRefmap 放的）与加工输出里；
    // 不设策略 Gradle 8 会直接以 "duplicate entry" 失败。两份内容一致，留一份即可。
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 摊平副本的类不进 slim jar（prod 类由 jarJar 的嵌套 jar 供应）
    exclude 'org/lwjgl/nanovg/**'
    // 消费 classes 目录（unpackNvg 会写它），Gradle 校验要求显式声明
    dependsOn 'unpackNvg'

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'pickupcard.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

// 【为什么这条必须写】摊平是往 compileJava 的输出目录里放文件 —— 这是开发期类加载器逼出来的
// （它只认我们自己的 classes 根，见上面的长注释）。Gradle 8 的任务依赖校验不允许
// "某任务的输出被别的任务拿去当输入却不声明关系"，compileTestJava 的类路径就含这个目录，
// 所以这里显式声明。不声明的话构建会直接失败（不是警告）。
tasks.matching { it.name == 'compileTestJava' }.configureEach {
    dependsOn 'unpackNvg'
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    // 许可与第三方声明各只有一份正本（都在仓库根）—— 这里把它们拷进 jar，免得资源目录里
    // 再养一份会漂的副本（2026-09-20 仓库重构：原来那份就埋在 src/main/resources 里）。
    from(new File(pickupcardRepoRoot, 'LICENSE'))
    from(new File(pickupcardRepoRoot, 'THIRD_PARTY_NOTICES.md'))
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version, forge_version_range: forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The mixin annotation processor writes the refmap into build/tmp/compileJava,
// so copy it into the resources output where Mixin looks for it.
//
// An incremental compile can wipe build/tmp/compileJava without re-running the
// AP, and the refmap then disappears silently: the shipped jar dies at startup
// with "No refMap loaded" for every mixin. The guard for that lives in
// verifyRefmap, NOT here — a Copy whose source is missing is reported as
// NO-SOURCE and Gradle then skips every action on the task, so a doFirst check
// in this task would never run in exactly the case it must catch.
tasks.register('copyRefmap', Copy) {
    from "${buildDir}/tmp/compileJava"
    into "${buildDir}/resources/main"
    include 'mixins.pickupcard.refmap.json'
}

// Runs unconditionally (no declared outputs, so it can never be up to date) and
// fails the build when the refmap did not make it into the resources output.
tasks.register('verifyRefmap') {
    dependsOn 'copyRefmap'
    doLast {
        def refmap = file("${buildDir}/resources/main/mixins.pickupcard.refmap.json")
        if (!refmap.isFile()) {
            throw new GradleException(
                "打出来的 jar 里没有 mixins.pickupcard.refmap.json（${refmap.path} 不存在）。\n" +
                "Mixin 注解处理器没有产出它 —— 增量编译会清掉 build/tmp/compileJava 而不重跑 AP。\n" +
                "这样的 jar 启动时会以 'No refMap loaded' 崩掉，所以在这里直接失败。\n" +
                "解决：./gradlew clean build")
        }
    }
}
compileJava.finalizedBy 'copyRefmap'

tasks.register('writeDevManifest') {
    doLast {
        def mfDir = file("${buildDir}/resources/main/META-INF")
        mfDir.mkdirs()
        file("${mfDir}/MANIFEST.MF").text =
            'Manifest-Version: 1.0\n' +
            'MixinConfigs: pickupcard.mixins.json\n'
        logger.lifecycle('Generated MANIFEST.MF with MixinConfigs for dev environment')
    }
}
processResources.finalizedBy 'writeDevManifest'
jar.dependsOn 'verifyRefmap'
compileTestJava.dependsOn 'copyRefmap'

// 共享层的单测（NoticeQueue / MergeWindow / CountFormat）在这里跑。
// 它们不碰 MC，所以这个任务不需要启动游戏。
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

// ---------------------------------------------------------------------------
// Release publishing (Modrinth + CurseForge)
// ---------------------------------------------------------------------------

def storeVersion = "Forge-${project.minecraft_version}-${project.mod_version}"

def changelogFor(version) {
    // 单仓库之后 RELEASE_NOTES.md 只有仓库根那一份，各平台不再各存一份
    def notes = new File(pickupcardRepoRoot, 'RELEASE_NOTES.md')
    if (!notes.isFile()) {
        return "Pickup Card ${version}"
    }
    def text = notes.getText('UTF-8')
    def start = text.indexOf("## v${version}")
    if (start < 0) {
        return "Pickup Card ${version}"
    }
    def end = text.indexOf('\n## ', start + 1)
    def section = end > start ? text.substring(start, end) : text.substring(start)
    // Store changelog convention: the trailing English block of the version
    // section in RELEASE_NOTES.md (Chinese summary first, English last).
    def trimmed = section.trim()
    // Store changelog = 分隔线 `---` **之后**的英文块（写法约定见 RELEASE_NOTES.md 顶部）。
    // 【为什么不用"最后一个空行"】英文块自己也会分段，按空行取只会取到最后一段、把前面几段
    // 一起丢掉 —— v0.2.2 那段正好就是这样（2026-09-20 换成分隔线切分）。老版本段没有分隔线时
    // 整段兜底，不会因此取空。
    def sep = trimmed.indexOf('\n---')
    return sep >= 0 ? trimmed.substring(sep + 4).trim() : trimmed
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: ""
    projectId = (project.findProperty('modrinth_project_id') ?: '').toString()
    versionNumber = storeVersion
    versionType = "release"
    uploadFile = tasks.named('jarJar').get()
    gameVersions = [project.minecraft_version]
    loaders = ["forge"]
    changelog = changelogFor(project.version)
}

def mrProjectId = (project.findProperty('modrinth_project_id') ?: '').toString()
tasks.named('modrinth') {
    onlyIf { System.getenv("MODRINTH_TOKEN") && !mrProjectId.isEmpty() && mrProjectId != 'UNSET' }
}

def cfProjectId = (project.findProperty('curseforge_project_id') ?: '').toString()
def cfConfigured = cfProjectId ==~ /\d+/

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN") ?: ""
    onlyIf { cfConfigured && System.getenv("CURSEFORGE_TOKEN") }

    if (cfConfigured) {
        def main = upload(cfProjectId as int, tasks.named('jarJar').get())
        main.changelogType = 'markdown'
        main.changelog = changelogFor(project.version)
        main.releaseType = 'release'
        main.displayName = storeVersion
        main.addGameVersion project.minecraft_version
        main.addModLoader 'Forge'
        main.addJavaVersion 'Java 17'
        // CurseForge rejects uploads without an environment tag (error 1021).
        main.addEnvironment 'Client', 'Server'
    }
}

tasks.register('publishMods') {
    group = 'publishing'
    description = 'Publish the mod to Modrinth and CurseForge.'
    dependsOn 'modrinth', 'curseforge'
}
