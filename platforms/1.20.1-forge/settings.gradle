pluginManagement {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        // China mirrors last: fallback for local builds; overseas CI resolves from the canonical repos above
        maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        maven { url = 'https://maven.aliyun.com/repository/public/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'pickupcard'

// Trellis UI 框架（dev.e33.trellis:core/nvg）的两个解析来源，二选一：
// 1. 本机有 Trellis 源码（默认 D:/Trellis，可用 -PtrellisDir= 覆盖）→ 复合构建直接吃源码，
//    改框架立即生效，不发布、不装 jar；
// 2. 都没有（CI / 别人的机器）→ build.gradle 的 flatDir 从 third_party/trellis/ 里
//    提交的两颗 jar 解析（它们就是 0.2.4 部署产物里嵌套的同两颗，bit 级等于真机验证过的份）。
// 【为什么必须条件化】0.2.4 险情：includeBuild 写死本机绝对路径，CI 根本构不出 0.2.4。
// 【为什么用 new File 而不是 file()】project.file() 对含 ':' 的路径按 URL 处理：
// Windows 本机 'D:/Trellis' 能解析，Linux CI 上直接抛 "Cannot convert URL 'D:/Trellis'
// to a file"（v0.2.5 首发 run 36676140514 就栽在这）。new File() 在任何平台都只是
// 构造一个可能不存在的路径，exists() 在 Linux 上对盘符路径必然 false，正好落进 flatDir。
def trellisDir = providers.gradleProperty('trellisDir').getOrElse('D:/Trellis')
if (new File(trellisDir).isDirectory()) {
    includeBuild(trellisDir)
}
