pluginManagement {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        // China mirrors last: fallback for local builds; overseas CI resolves from the canonical repos above
        maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        maven { url = 'https://maven.aliyun.com/repository/public/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'pickupcard'

// Trellis 试点（分支 trellis-pilot）：复合构建直接吃源码，不发布、不装 jar。
// 【这一行是本机绝对路径，只活在试点分支上】—— 绝不能进 main，否则 CI 和别人的机器全炸。
includeBuild('D:/Trellis')
