modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
# 仓库地址只在 gradle.properties 里写一次（mod_repo_url），这里拼出来用
issueTrackerURL = "${mod_repo_url}/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "${mod_authors}"
    # credits 与 displayURL 都是 mod 列表详细信息里会显示的两行（Forge 的 ModListScreen 读它们）
    credits = '''${mod_credits}'''
    displayURL = "${mod_repo_url}"
    # 图标：logo.png 在资源根，由 design/icon.py 从 design/logo.png 派生 ——
    # 它是唯一一处没有门禁盯着的视觉资产，所以至少要能一键重来。
    logoFile = "logo.png"
    description = '''${mod_description}'''
    # 纯客户端：这个 mod 不注册任何服务端内容，装了也不会让服务器拒绝原版客户端
    clientRequired = true
    displayTest = "IGNORE_ALL_VERSION"

[[dependencies."${mod_id}"]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# 无必需前置：渲染自绘（RenderGuiEvent + GuiGraphics），不依赖任何 UI 框架 mod。
# 稀有度联动（RarityCore）是可选软依赖，运行期探测，不在这里声明。
