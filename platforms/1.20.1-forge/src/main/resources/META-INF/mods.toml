modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/E33EPUS/PickupCard/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "${mod_authors}"
    # 图标：logo.png 在资源根，由 design/icon.py 按 tokens.css 里的配色重新产出 ——
    # 它是唯一一处没有门禁盯着的视觉资产，所以至少要能一键重来。
    logoFile = "logo.png"
    description = '''${mod_description}'''
    # 纯客户端：这个 mod 不注册任何服务端内容，装了也不会让服务器拒绝原版客户端
    clientRequired = true
    displayTest = "IGNORE_ALL_VERSION"

[[dependencies."${mod_id}"]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# 无必需前置：渲染自绘（RenderGuiEvent + GuiGraphics），不依赖任何 UI 框架 mod。
# 稀有度联动（RarityCore）是可选软依赖，运行期探测，不在这里声明。
